
name: build-mingw

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch: [x86_64]
        crt: [ucrt]

    outputs:
      GCC_VERSION: ${{ steps.build.outputs.GCC_VERSION }}
      MINGW_VERSION: ${{ steps.build.outputs.MINGW_VERSION }}
      GDB_VERSION: ${{ steps.build.outputs.GDB_VERSION }}
      MAKE_VERSION: ${{ steps.build.outputs.MAKE_VERSION }}

    steps:

      - name: checkout
        uses: actions/checkout@v6

      - name: install dependencies
        run: |
          sudo apt-get install --no-install-recommends -y \
            ca-certificates \
            libgmp-dev      \
            libmpc-dev      \
            libmpfr-dev     \
            libisl-dev      \
            xz-utils        \
            texinfo         \
            patch           \
            p7zip           \
            cmake           \
            make            \
            curl            \
            m4              \
            gcc             \
            g++

      - name: build
        id: build
        run: ./build.sh ${{ matrix.arch }} ${{ matrix.crt }}

      - name: upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.arch }}-${{ steps.build.outputs.GCC_VERSION }}-${{ steps.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}
          path: ${{ matrix.arch }}-${{ steps.build.outputs.GCC_VERSION }}-${{ steps.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}.7z
          if-no-files-found: error
          compression-level: 0

  release:
    runs-on: ubuntu-26.04
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

      - name: release
        run: |
          echo 'GCC v${{ needs.build.outputs.GCC_VERSION }}'         >>notes.txt
          echo 'MinGW-w64 v${{ needs.build.outputs.MINGW_VERSION }}' >>notes.txt
          echo 'GDB v${{ needs.build.outputs.GDB_VERSION }}'         >>notes.txt
          echo 'Make v${{ needs.build.outputs.MAKE_VERSION }}'       >>notes.txt
          gh release create ${{ matrix.arch }}-${{ needs.build.outputs.GCC_VERSION }}-${{ needs.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }} -R "${GITHUB_REPOSITORY}" -t '${{ matrix.arch }}-${{ needs.build.outputs.GCC_VERSION }}-${{ needs.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}' -F notes.txt

      - name: get artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ matrix.arch }}-${{ needs.build.outputs.GCC_VERSION }}-${{ needs.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}-*
          merge-multiple: true

      - name: upload artifacts
        run: gh release upload '${{ matrix.arch }}-${{ needs.build.outputs.GCC_VERSION }}-${{ needs.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}' ${{ matrix.arch }}-${{ needs.build.outputs.GCC_VERSION }}-${{ needs.build.outputs.MINGW_VERSION }}-posix-seh-${{ matrix.crt }}-*.7z -R "${GITHUB_REPOSITORY}"
